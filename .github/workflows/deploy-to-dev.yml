name: Deploy to dev

concurrency:
  group: deploy-dev
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  deploy:
    environment: dev
    name: Deploy to dev
    runs-on: ubuntu-24.04
    env:
      DOCKER_REGISTRY: registry.blumilk.pl
      DOCKER_REGISTRY_USER_NAME: robot@blumilkbot-harbor
      DOCKER_REGISTRY_PROJECT_NAME: praktyki
      DOCKER_REGISTRY_REPO_NAME: 2026b
      TARGET_DIR_ON_SERVER: /blumilk/deployments/dev/projects
      ENVIRONMENT: dev
    steps:
      - name: set branch name
        run: echo "BRANCH_NAME=$GITHUB_REF_NAME" >> $GITHUB_ENV

      - name: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH_NAME }}
